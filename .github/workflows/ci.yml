# No keys, no network at run time: the tests use a stand-in for the VS Code API plus jsdom.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, to notice dependency or runtime changes
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only used by the tag-only release step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show toolchain versions
        run: node -v && npm -v && git status --short
      - run: npm ci --no-audit --no-fund --loglevel=http
      - run: npm test
      - run: npm run bench
      - run: npm run package
      - name: Check the package contents
        run: |
          npx vsce ls --no-dependencies > vsce-ls.txt
          grep -q "dist/extension.js" vsce-ls.txt
          grep -q "media/webview.js" vsce-ls.txt
          grep -q "package.nls.ko.json" vsce-ls.txt
          if grep -qE "^(src|test|out|examples)/" vsce-ls.txt; then echo "unexpected files in the package"; exit 1; fi
      - run: npm run preview
      - name: Attach the .vsix to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match package.json version $version"; exit 1
          fi
          vsix="chatlines-${version}.vsix"
          test -f "$vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" --title "$TAG" --verify-tag --generate-notes
          fi
      - name: Diagnostics on failure
        if: failure()
        run: |
          node -v; npm -v
          ls -la
          tail -n 80 ~/.npm/_logs/*.log || true
